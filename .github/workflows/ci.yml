name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  check-and-test:
    name: Verify Formatting, Types & Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Frontend formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "*.{json,md,ts}"

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run Frontend unit tests (Vitest)
        run: npm test

      - name: Build & test CLI workspace
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build:cli
          npm test --workspace @seymi/clipnest-cli

      - name: Check Rust formatting (rustfmt)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path packages/core/Cargo.toml --all -- --check

      - name: Run Rust core unit tests
        run: cargo test --manifest-path packages/core/Cargo.toml

      - name: Run Rust Tauri unit & integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
