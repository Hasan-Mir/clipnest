[package]
name = "clipnest"
version = "0.1.0"
description = "ClipNest - a fast, private clipboard manager for Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
base64 = "0.22"
regex = "1"
flate2 = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Only used by the optional UI-Automation caret locator (feature "uia").
windows = { version = "=0.58.0", optional = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

[features]
default = ["uia"]
# Finds the text caret in VS Code / Chrome / Word through UI Automation.
# If it ever fails to compile, build with:  --no-default-features
uia = ["dep:windows"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
